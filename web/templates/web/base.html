<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BMP OTT - An product by BMP Entertains{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bmp: {
                            bg: '#08090d',
                            surface: '#12151e',
                            border: '#1f2433',
                            accent: '#e50914'
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <style>
        body {
            background-color: #08090d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            background: rgba(8, 9, 13, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .hero-vignette {
            background: linear-gradient(180deg, rgba(8,9,13,0.3) 0%, rgba(8,9,13,0.8) 70%, #08090d 100%),
                        linear-gradient(90deg, #08090d 0%, rgba(8,9,13,0.6) 40%, transparent 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Premium Navigation Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-header border-b border-white/5 transition duration-300">
        <div class="max-w-[1700px] mx-auto px-4 sm:px-8 h-20 flex items-center justify-between">
            
            <div class="flex items-center space-x-10">
                <a href="{% url 'index' %}" class="flex items-center space-x-2 group">
                    <span class="text-3xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-red-600 via-rose-500 to-amber-500">
                        BMP
                    </span>
                    <span class="text-[9px] font-bold tracking-widest px-1.5 py-0.5 bg-red-600/20 text-red-500 border border-red-500/30 rounded uppercase">
                        OTT
                    </span>
                </a>

                <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium text-gray-300">
                    <a href="{% url 'index' %}" class="text-white font-bold hover:text-white transition">Home</a>
                    <a href="#series" class="hover:text-white transition">Web Series</a>
                    <a href="#movies" class="hover:text-white transition">Movies</a>
                    <a href="#categories" class="hover:text-white transition">Categories</a>
                </nav>
            </div>

            <div class="flex items-center space-x-5">
                <a href="" target="_blank" class="px-4 py-2 text-xs font-bold text-gray-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition flex items-center space-x-1.5 shadow-md">
                    <span>⚙️</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Shell -->
    <main class="flex-1 pt-20">
        {% block content %}{% endblock %}
    </main>

    <!-- Professional Footer -->
    <footer class="border-t border-white/10 py-12 mt-20 bg-black/40">
        <div class="max-w-[1700px] mx-auto px-4 text-center text-xs text-gray-500 space-y-3">
            <p class="font-semibold text-gray-400">BMP OTT • BMP ENTERTAINMENT PLATFORM</p>
            <p>© 2026 BMP OTT Inc. Enterprise OTT platform</p>
        </div>
    </footer>

</body>
</html>
